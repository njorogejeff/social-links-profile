<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      href="./assets/images/favicon-32x32.png"
      type="image/png"
      sizes="32x32"
    />
    <link rel="stylesheet" href="./src/style.css" />
    <title>Social Links Profile</title>
  </head>

  <body class="font-inter text-social-white text-center text-sm">
    <main class="bg-social-grey-900 grid min-h-screen place-content-center">
      <section class="container bg-social-grey-800 rounded-lg px-8 py-10">
        <img
          src="./assets/images/avatar-jessica.jpeg"
          alt="Jessica Randall Picture"
          class="w-20 rounded-full mx-auto mb-5"
        />
        <h1 class="text-xl font-semibold mb-2">Jessica Randall</h1>
        <h2 class="text-social-green text-xs font-semibold mb-7">London, United Kingdom</h2>
        <p class="text-xs mb-5"><q>Front-end developer and avid reader.</q></p>
        <ul>
          <a href="https://www.github.com" target="_blank">
            <li class="bg-social-grey-700 py-3 rounded-md mb-2 text-xs font-semibold hover:bg-social-green hover:text-social-grey-900 transition duration-300">
              GitHub
            </li>
          </a>
          <a href="https://www.frontendmentor.io" target="_blank">
            <li class="bg-social-grey-700 py-3 rounded-md mb-2 text-xs font-semibold hover:bg-social-green hover:text-social-grey-900 transition duration-300">
              Frontend Mentor
            </li>
          </a>
          <a href="https://www.linkedin.com" target="_blank">
            <li class="bg-social-grey-700 py-3 rounded-md mb-2 text-xs font-semibold hover:bg-social-green hover:text-social-grey-900 transition duration-300">
              LinkedIn
            </li>
          </a>
          <a href="https://www.twitter.com" target="_blank">
            <li class="bg-social-grey-700 py-3 rounded-md mb-2 text-xs font-semibold hover:bg-social-green hover:text-social-grey-900 transition duration-300">
              Twitter
            </li>
          </a>
          <a href="https://www.instagram.com" target="_blank">
            <li class="bg-social-grey-700 py-3 rounded-md text-xs font-semibold hover:bg-social-green hover:text-social-grey-900 transition duration-300">
              Instagram
            </li>
          </a>
        </ul>
      </section>
    </main>
  </body>
</html>
