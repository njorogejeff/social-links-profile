<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      href="./assets/images/favicon-32x32.png"
      type="image/png"
      sizes="32x32"
    />
    <link rel="stylesheet" href="./src/style.css" />
    <title>Social Links Profile</title>
  </head>

  <body class="font-inter text-social-white text-center text-sm">
    <main class="bg-social-grey-900 grid min-h-screen place-content-center">
      <section class="w-96 bg-social-grey-800 rounded-xl px-10 py-8">
        <img
          src="./assets/images/avatar-jessica.jpeg"
          alt="Jessica Randall Picture"
          class="w-23 rounded-full mx-auto mb-6"
        />
        <h1 class="text-2xl font-semibold mb-2">Jessica Randall</h1>
        <h2 class="text-social-green text-sm font-semibold mb-7">London, United Kingdom</h2>
        <p class="text-sm mb-5"><q>Front-end developer and avid reader.</q></p>

        <!-- Social Links -->
        <section>
          <a href="https://www.github.com" target="_blank" class="block bg-social-grey-700 py-3 rounded-md mb-4 text-sm font-semibold hover:bg-social-green hover:text-social-grey-900 transition duration-300">
            GitHub
          </a>
          <a href="https://www.frontendmentor.io" target="_blank" class="block bg-social-grey-700 py-3 rounded-md mb-4 text-sm font-semibold hover:bg-social-green hover:text-social-grey-900 transition duration-300">
            Frontend Mentor
          </a>
          <a href="https://www.linkedin.com" target="_blank" class="block bg-social-grey-700 py-3 rounded-md mb-4 text-sm font-semibold hover:bg-social-green hover:text-social-grey-900 transition duration-300">
            LinkedIn
          </a>
          <a href="https://www.twitter.com" target="_blank" class="block bg-social-grey-700 py-3 rounded-md mb-4 text-sm font-semibold hover:bg-social-green hover:text-social-grey-900 transition duration-300">
            Twitter
          </a>
          <a href="https://www.instagram.com" target="_blank" class="block bg-social-grey-700 py-3 rounded-md mb-4 text-sm font-semibold hover:bg-social-green hover:text-social-grey-900 transition duration-300">
            Instagram
          </a>
        </section>
      </section>
    </main>
  </body>
</html>
